[package]
name = "faceit_voice_parser"
version = "1.1.0"
edition = "2021"

[dependencies]
source2-demo = { version = "0.5.10", features = ["cs2"] }
source2-demo-protobufs = "0.5.10"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
